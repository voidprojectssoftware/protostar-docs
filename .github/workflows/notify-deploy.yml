# Tells the PRIVATE infra repo to rebuild/redeploy the docs whenever main changes.
# This public repo carries no hosting detail — it only fires a repository_dispatch
# (docs-content-updated) that protostar-docs-infra's deploy workflow listens for. A
# merged PR produces a push to main, so this covers PR merges and direct pushes alike.
#
# Thin caller for voidprojects-workflows' reusable notify-repo workflow, which owns the
# auth (org-owned GitHub App) and the dispatch API call. `secrets: inherit` passes the
# org-level VOIDPROJECTS_DEPLOY_APP_ID / VOIDPROJECTS_DEPLOY_PRIVATE_KEY through — no
# per-repo secrets. (Deployment still lives entirely in the private repo; see DEPLOYMENT.md.)
name: notify-deploy

on:
  push:
    branches: [main]

concurrency:
  group: notify-deploy
  cancel-in-progress: true

jobs:
  notify:
    uses: voidprojectssoftware/voidprojects-workflows/.github/workflows/notify-repo.yml@main
    secrets: inherit
    with:
      target-repo: protostar-docs-infra
      event-type: docs-content-updated
